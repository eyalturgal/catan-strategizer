# Project settings. Libraries to install are listed in requirements.txt.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catan-strategizer"
version = "0.1.0"
description = "Reads a Catan board and explains the opening strategy, with evidence."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
